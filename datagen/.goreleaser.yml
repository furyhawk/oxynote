version: 2
project_name: oxynote
dist: bin
snapshot:
  version_template: dev
builds:
  - id: oxynote-datagen
    main: ./cmd
    binary: "{{ .ProjectName }}-datagen"
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    # goarch takes no template, so every architecture a Docker engine may
    # run is compiled and dockers_v2 below builds the image for one of them.
    goarch:
      - amd64
      - arm64
    tags:
      - "{{if not .IsSnapshot}} prod {{end}}"
    flags:
      - "-trimpath"
    ldflags:
      - "-s -w"
dockers_v2:
  - id: datagen
    ids:
      - oxynote-datagen
    dockerfile: ./Dockerfile.dev
    images:
      - ghcr.io/oxynote/datagen
    tags:
      - "{{ .Version }}"
      - latest
    # a snapshot loads one image per platform into the local daemon, so only
    # the engine's own architecture is built. Set through datagen's Makefile
    # DOCKER_ARCH.
    platforms:
      - 'linux/{{ envOrDefault "DOCKER_ARCH" "amd64" }}'
    sbom: false
    flags:
      - "--provenance=false"
checksum:
  disable: true
archives:
  - formats: ["binary"] # disable archives
release:
  disable: true # disable release uploading to github/gitlab
changelog:
  use: github
  filters:
    exclude:
      - "^workflow(s?):"
      - "^github:"
announce:
  skip: true
